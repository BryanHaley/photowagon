name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      fuzz:
        description: "Run the fuzz job"
        type: boolean
        default: false
      fuzz_seconds:
        description: "Seconds per fuzz target"
        default: "600"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The crates the iOS app links (`cargo tree -p photocraft-ffi`).
  APP_CRATES: >-
    -p photocraft-affinity -p photocraft-algo -p photocraft-cms -p photocraft-codecs -p photocraft-color
    -p photocraft-compose -p photocraft-doc -p photocraft-engine -p photocraft-ffi -p photocraft-format
    -p photocraft-geom -p photocraft-gpu -p photocraft-io -p photocraft-ops -p photocraft-paint
    -p photocraft-plugins -p photocraft-psd -p photocraft-raster -p photocraft-raw -p photocraft-text
    -p photocraft-vector

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The engine and the Swift bridge on macOS, where the app's C++ libraries (LibRaw, libjxl) and
  # Metal build as they do for the app.
  rust:
    timeout-minutes: 90
    name: engine tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: libjxl dependencies
        run: git -C submodules/libjxl submodule update --init --depth 1 third_party/highway third_party/brotli third_party/skcms
      - run: brew install ninja
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.146

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy $APP_CRATES -p xtask --all-targets --locked -- -D warnings
      - name: Dependency layering
        run: cargo xtask layers
      - name: Test
        run: cargo nextest run --profile ci $APP_CRATES --locked --lib --bins --tests
      # Every command against adversarial params must return Err, never panic or hang (AGENTS.md
      # Rule 9). It is `#[ignore]`d (slow), so Test skips it.
      - name: Panic hunt
        run: >-
          cargo nextest run --profile ci $APP_CRATES --locked --lib --bins --tests
          --run-ignored only -E 'binary_id(photocraft-engine::panic_hunt)'
      - name: Doctests
        run: cargo test $APP_CRATES --locked --doc

  # The app's unit tests (ios/PhotoWagonTests) on a simulator. The UI tests are run by hand.
  ios:
    timeout-minutes: 90
    name: app unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: libjxl dependencies
        run: git -C submodules/libjxl submodule update --init --depth 1 third_party/highway third_party/brotli third_party/skcms
      - run: brew install xcodegen ninja
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-sim
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Unit tests
        run: |
          cargo xtask ios --sim
          cd ios && xcodegen generate
          xcodebuild -project PhotoWagon.xcodeproj -scheme PhotoWagon \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:PhotoWagonTests CODE_SIGNING_ALLOWED=NO test

  corpus:
    timeout-minutes: 30
    # Real-file corpus tests (cargo feature `corpus`). The corpora are pinned in
    # xtask/src/corpus_pins.rs and sha256-verified (xtask/*.sha256) after both a cache restore and
    # a download; a missing corpus fails the tests.
    name: corpus tests
    runs-on: ubuntu-latest
    env:
      # Without the release profile's LTO: it ran over the whole graph for each corpus test binary.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: corpus
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Restore test corpora
        uses: actions/cache@v4
        with:
          path: corpus/
          key: corpus-${{ hashFiles('xtask/src/corpus_pins.rs', 'xtask/*.sha256') }}
      - name: Fetch and verify corpora
        run: cargo xtask corpus --all
      - name: Corpus tests
        run: cargo xtask test-corpus

  fuzz:
    timeout-minutes: 60
    name: fuzz (${{ matrix.target.crate }}/${{ matrix.target.name }})
    # Manual trigger only.
    if: github.event_name == 'workflow_dispatch' && inputs.fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { crate: psd, name: parse }
          - { crate: psd, name: descriptor }
          - { crate: psd, name: image_source_data }
          - { crate: psd, name: grd }
          - { crate: psd, name: ase }
          - { crate: psd, name: aco }
          - { crate: psd, name: patterns }
          - { crate: psd, name: filter_effects }
          - { crate: psd, name: metadata }
          - { crate: psd, name: tagged }
          - { crate: psd, name: resources }
          - { crate: codecs, name: decode_any }
          - { crate: codecs, name: decode_png }
          - { crate: codecs, name: decode_jpeg }
          - { crate: codecs, name: decode_tiff }
          - { crate: codecs, name: decode_exr }
          - { crate: affinity, name: preview }
          - { crate: affinity, name: import_preview, args: "--features io" }
          - { crate: format, name: load }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/${{ matrix.target.crate }}/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz
        working-directory: crates/${{ matrix.target.crate }}
        run: cargo fuzz run ${{ matrix.target.name }} ${{ matrix.target.args }} -- -max_total_time=${{ inputs.fuzz_seconds }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target.crate }}-${{ matrix.target.name }}
          path: crates/${{ matrix.target.crate }}/fuzz/artifacts
